<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeAlpha Social - Feed</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav id="site-nav"></nav>

<div class="container">
  <div id="compose-card" class="card" style="display:none">
    <div class="compose">
      <div id="compose-avatar"></div>
      <div style="flex:1">
        <textarea id="post-content" placeholder="What's on your mind?" maxlength="500"></textarea>
        <div class="compose-footer">
          <button id="post-btn" class="btn">Post</button>
        </div>
      </div>
    </div>
  </div>

  <div class="tabs" id="tabs" style="display:none">
    <button class="btn btn-outline active" id="tab-all">For You</button>
    <button class="btn btn-outline" id="tab-following">Following</button>
  </div>

  <div id="feed" class="card"></div>
</div>

<footer>&copy; 2026 CodeAlpha Social — Full Stack Development Task 2</footer>

<script src="/js/app.js"></script>
<script src="/js/posts.js"></script>
<script>
let currentUser = null;

async function loadFeed(mode) {
  const feedEl = document.getElementById('feed');
  const posts = await api(mode === 'following' ? '/posts/following' : '/posts');
  if (posts.length === 0) {
    feedEl.innerHTML = `<p class="empty-state">${mode === 'following' ? 'No posts yet from people you follow. Try the "For You" tab!' : 'No posts yet. Be the first to share something!'}</p>`;
    return;
  }
  feedEl.innerHTML = posts.map(p => renderPost(p, currentUser)).join('');
  attachPostHandlers(feedEl, currentUser);
}

(async () => {
  currentUser = await renderNav();
  if (currentUser) {
    document.getElementById('compose-card').style.display = 'block';
    document.getElementById('compose-avatar').innerHTML = avatarHTML(currentUser);
    document.getElementById('tabs').style.display = 'flex';

    document.getElementById('post-btn').addEventListener('click', async () => {
      const textarea = document.getElementById('post-content');
      if (!textarea.value.trim()) return;
      await api('/posts', { method: 'POST', body: JSON.stringify({ content: textarea.value }) });
      textarea.value = '';
      await loadFeed('all');
      document.getElementById('tab-all').classList.add('active');
      document.getElementById('tab-following').classList.remove('active');
    });

    document.getElementById('tab-all').addEventListener('click', () => {
      document.getElementById('tab-all').classList.add('active');
      document.getElementById('tab-following').classList.remove('active');
      loadFeed('all');
    });
    document.getElementById('tab-following').addEventListener('click', () => {
      document.getElementById('tab-following').classList.add('active');
      document.getElementById('tab-all').classList.remove('active');
      loadFeed('following');
    });
  }
  await loadFeed('all');
})();
</script>
</body>
</html>
