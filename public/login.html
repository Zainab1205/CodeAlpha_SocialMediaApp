<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - CodeAlpha Social</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav id="site-nav"></nav>

<div class="container">
  <div class="auth-wrap card">
    <h2>Welcome Back</h2>
    <form id="login-form">
      <div class="form-group">
        <label>Email or Username</label>
        <input type="text" id="emailOrUsername" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>
      <p id="error" class="form-error"></p>
      <button type="submit" class="btn btn-block">Login</button>
    </form>
    <p class="form-footer">Don't have an account? <a href="/register.html" style="color:#7c3aed">Register</a></p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
renderNav();
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const emailOrUsername = document.getElementById('emailOrUsername').value.trim();
  const password = document.getElementById('password').value;
  try {
    await api('/auth/login', { method: 'POST', body: JSON.stringify({ emailOrUsername, password }) });
    window.location.href = '/';
  } catch (err) {
    document.getElementById('error').textContent = err.message;
  }
});
</script>
</body>
</html>
