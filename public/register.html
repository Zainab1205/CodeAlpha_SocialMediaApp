<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - CodeAlpha Social</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav id="site-nav"></nav>

<div class="container">
  <div class="auth-wrap card">
    <h2>Join CodeAlpha Social</h2>
    <form id="register-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" required placeholder="e.g. jane_doe">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" minlength="6" required>
      </div>
      <p id="error" class="form-error"></p>
      <button type="submit" class="btn btn-block">Register</button>
    </form>
    <p class="form-footer">Already have an account? <a href="/login.html" style="color:#7c3aed">Login</a></p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
renderNav();
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  try {
    await api('/auth/register', { method: 'POST', body: JSON.stringify({ name, username, email, password }) });
    window.location.href = '/';
  } catch (err) {
    document.getElementById('error').textContent = err.message;
  }
});
</script>
</body>
</html>
